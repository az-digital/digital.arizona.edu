name: Build and deploy documentation for 5.x
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      REPO_DISPATCH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/deploy-bootstrap-docs.yml
    with:
      sha: ${{ inputs.sha }}
      version: ${{ inputs.version }}
      major: '5'
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
